# Gradle options only. Mod/version metadata lives in stonecutter.properties.toml now.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# On the 26.2 node, Kotlin's jvmTarget falls back below the Java toolchain
# version (25) because the pinned Kotlin Gradle plugin (2.1.20) doesn't know
# JVM_25 yet -- see the fallback in build.gradle.kts. That produces a legitimate
# compileJava/compileKotlin target mismatch; downgrade Gradle 9's default "error"
# for this check to a warning so the build doesn't fail on it.
kotlin.jvm.target.validation.mode=warning
