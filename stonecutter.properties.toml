# Centralized version metadata. See:
# https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
#
# NOTE ON ACCURACY: fabric_api / fabric_loader builds below were verified against
# fabricmc.net and the Fabric API Modrinth/Maven index as of Aug 2026, except where
# marked "verify" -- those are best-known values for older releases and should be
# double-checked at https://fabricmc.net/develop before the first build of that
# version, since Termux/CI has real network access to that site and this sandbox
# does not.

mod.id = "turtle-client"
mod.name = "Turtle Client"
mod.group = "com.endiq"
mod.version = "1.0.0"

# fabric-language-kotlin is loader-based, not Minecraft-version-based, so a single
# global pin is the right idea -- but it also has to stay within what THIS Loom
# version's remapper can handle. loomx.loom_version below (1.17-SNAPSHOT) bundles a
# kotlinx-metadata-jvm that can only WRITE metadata up to format 2.2.0. Kotlin's
# metadata version tracks the language version 1:1, so any fabric-language-kotlin
# build compiled with Kotlin >2.2.0 (this includes 1.13.10+ through at least
# 1.13.13+kotlin.2.4.10) fails during remap with:
#   "kotlinx-metadata-jvm cannot write metadata for future compiler versions"
# 1.13.2+kotlin.2.1.20 is the last confirmed-working pin (Kotlin 2.1.20 metadata,
# well under the 2.2.0 write ceiling) -- it's also what the repo's own root
# gradle.properties already had before this file's value overrode it.
# If you bump loomx.loom_version to a release with an updated kotlinx-metadata-jvm,
# re-verify the write ceiling before moving deps.fabric_kotlin forward again.
deps.fabric_kotlin = "1.13.2+kotlin.2.1.20"
deps.fabric_loader = "0.19.3"
loomx.loom_version = "1.17-SNAPSHOT"

["1.18.2"]
mod.mc_compat = "1.18.2"
mod.mc_releases = ["1.18.2"]
deps.fabric_api = "0.76.0+1.18.2"     # verify
deps.yarn = "1.18.2+build.4"           # verify

["1.19.4"]
mod.mc_compat = "1.19.4"
mod.mc_releases = ["1.19.4"]
deps.fabric_api = "0.87.2+1.19.4"     # verify
deps.yarn = "1.19.4+build.2"           # verify

["1.20.1"]
mod.mc_compat = "1.20.1"
mod.mc_releases = ["1.20.1"]
deps.fabric_api = "0.92.2+1.20.1"     # verify
deps.yarn = "1.20.1+build.10"          # verify

["1.20.6"]
mod.mc_compat = "1.20.6"
mod.mc_releases = ["1.20.6"]
deps.fabric_api = "0.100.8+1.20.6"    # verify
deps.yarn = "1.20.6+build.3"           # verify

["1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
mod.mc_releases = ["1.21", "1.21.1"]
deps.fabric_api = "0.116.15+1.21.1"    # confirmed
deps.yarn = "1.21.1+build.3"           # verify

["1.21.4"]
mod.mc_compat = "1.21.4"
mod.mc_releases = ["1.21.4"]
deps.fabric_api = "0.119.4+1.21.4"     # confirmed (existing project baseline)
deps.yarn = "1.21.4+build.8"           # confirmed (existing project baseline)

["1.21.11"]
mod.mc_compat = "1.21.11"
mod.mc_releases = ["1.21.11"]
deps.fabric_api = "0.141.6+1.21.11"    # confirmed
deps.yarn = "1.21.11+build.4"          # confirmed

["26.2"]
# 26.2 has no Yarn mappings -- Minecraft ships fully unobfuscated. loom-back-compat
# picks the non-remapping Loom variant automatically for this node.
mod.mc_compat = "~26.2"
mod.mc_releases = ["26.2"]
deps.fabric_api = "0.156.0+26.2"       # confirmed index as of Aug 2026, except where
