name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc_version:
          - "1.18.2"
          - "1.19.4"
          - "1.20.1"
          - "1.20.6"
          - "1.21.1"
          - "1.21.4"
          - "1.21.11"
          - "26.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.2 needs Java 25; everything else is fine on 21+. setup-java with
      # multiple versions installed lets Gradle's toolchain resolver pick the
      # right one per node (see requiredJava in build.gradle.kts).
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.mc_version }}
        run: |
          set +e
          ./gradlew "${{ matrix.mc_version }}:buildAndCollect" --stacktrace --console=plain > build.log 2>&1
          status=$?
          cat build.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path("build.log").read_text(errors="replace").splitlines()
          markers = re.compile(r"(^e: |error:|FAILURE:|What went wrong:|Execution failed for task|Unresolved reference|Type mismatch|^> Task .* FAILED)", re.I)
          selected = []
          for index, line in enumerate(lines):
              if markers.search(line):
                  selected.extend(lines[max(0, index - 1):min(len(lines), index + 2)])
          if not selected:
              selected = lines[-24:]
          text = "\n".join(dict.fromkeys(selected[-48:]))
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build diagnostics::{text}")
          PY
          fi
          exit "$status"

      - name: Locate output jar
        id: jar
        run: |
          JAR=$(find build/libs -path "*${{ matrix.mc_version }}*" -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n1)
          if [ -z "$JAR" ]; then
            echo "No output jar found for ${{ matrix.mc_version }}" >&2
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turtle-client-${{ matrix.mc_version }}-${{ github.run_number }}
          path: ${{ steps.jar.outputs.path }}

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: artifacts/**/*.jar
          generate_release_notes: true
