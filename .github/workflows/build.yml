name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # gradlew loses its executable bit fairly often when this repo has been
      # touched from a Termux/FUSE filesystem -- force it back on regardless.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Locate output jar
        id: jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n1)
          if [ -z "$JAR" ]; then
            echo "No output jar found in build/libs" >&2
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turtle-client-${{ github.run_number }}
          path: ${{ steps.jar.outputs.path }}

      - name: Create release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
