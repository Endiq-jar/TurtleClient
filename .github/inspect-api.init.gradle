// Temporary branch-only diagnostic; removed once the compatibility build is verified.
tasks.register('inspectMinecraftApi') {
    doLast {
        def cp = sourceSets.main.compileClasspath.asPath
        def specs = [
            'net.minecraft.client.renderer.extract.LevelExtractor': '(extract|[Ss]etup|[Cc]ull|[Tt]errain|[Ss]ection|visible)',
            'net.minecraft.client.renderer.LevelRenderer': '(Sky|Cloud|Terrain|Section|RenderSection|setup|visible)',
            'net.minecraft.client.renderer.entity.EntityRenderDispatcher': '(shouldRender|class |extractRenderState)',
            'net.minecraft.client.renderer.blockentity.BlockEntityRenderer': '.*',
            'net.minecraft.client.renderer.entity.EntityRenderer': '(NameTag|nameTag|extractRenderState|class )',
            'net.minecraft.client.renderer.entity.state.EntityRenderState': '(nameTag|light|[Pp]os|class )',
            'net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection': '(Origin|origin|BlockPos|class )',
            'net.minecraft.client.particle.ParticleEngine': '(createParticle|ParticleOptions|class )',
            'net.minecraft.client.gui.screens.LoadingOverlay': '(reload|extractRenderState|class )',
            'net.minecraft.client.renderer.state.level.CameraRenderState': '(orientation|class )'
        ]
        specs.each { name, pattern ->
            def process = new ProcessBuilder(System.getenv('JAVA_HOME_25_X64') + '/bin/javap', '-private', '-classpath', cp, name).redirectErrorStream(true).start()
            def text = process.inputStream.getText('UTF-8')
            process.waitFor()
            text = text.readLines().findAll { it =~ pattern }.join('\n')
            println "::notice title=API ${name}::" + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
        }
    }
}
tasks.named('compileKotlin') { dependsOn('inspectMinecraftApi') }
