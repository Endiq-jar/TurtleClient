// Temporary branch-only diagnostic; removed once the compatibility build is verified.
tasks.register('inspectMinecraftApi') {
    doLast {
        def cp = sourceSets.main.compileClasspath.asPath
        def specs = [
            'net.minecraft.client.renderer.entity.EntityRenderDispatcher': '(submit|render|class |[Nn]ame[Tt]ag)',
            'net.minecraft.client.renderer.entity.EntityRenderer': '(submit|render|class |[Nn]ame[Tt]ag)',
            'net.minecraft.client.renderer.SubmitNodeCollector': '(CustomGeometry|NameTag|class |interface )',
            'net.minecraft.client.renderer.SubmitNodeStorage$NameTagSubmit': '.*',
            'net.minecraft.client.renderer.feature.NameTagFeatureRenderer': '.*',
            'net.minecraft.client.renderer.LevelRenderer': '(submitFeatures|submitEntity|NameTag|nameTag)',
            'net.minecraft.client.renderer.state.level.LevelRenderState': '(entities|Entity|nameTag|NameTag|cameraRenderState)',
            'net.minecraft.client.renderer.entity.state.EntityRenderState': '.*',
            'com.mojang.blaze3d.vertex.VertexConsumer': '(addVertex|setOverlay|setLight|setNormal|class |interface )',
            'net.minecraft.client.renderer.rendertype.RenderTypes': 'entityTranslucent'
        ]
        specs.each { name, pattern ->
            def process = new ProcessBuilder(System.getenv('JAVA_HOME_25_X64') + '/bin/javap', '-private', '-classpath', cp, name).redirectErrorStream(true).start()
            def text = process.inputStream.getText('UTF-8')
            process.waitFor()
            text = text.readLines().findAll { it =~ pattern }.join('\n')
            println "::notice title=API ${name}::" + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
        }
    }
}
tasks.named('compileKotlin') { dependsOn('inspectMinecraftApi') }
